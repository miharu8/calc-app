function cat(i){$.innerHTML=`<button class="bk" id="bk">← もどる</button><h1>${CAT[i]}</h1><h2>どれ？</h2>`+SC.map((s,k)=>s[0]===i?`<button class="b ${COL[i%4]}" data-s="${k}">${esc(s[1])}</button>`:'').join('');$.querySelector('#bk').onclick=home;$.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>sit(+b.dataset.s))}
function sit(k){const[ci,tt,fw,why,fl,tp,un]=SC[k];
 $.innerHTML=`<button class="bk" id="bk">← もどる</button><h1 style="font-size:18px">${esc(tt)}</h1><div class="c pkc"><div class="t" style="color:#8A3A58">使う式</div><div class="q" style="font-size:20px">${esc(fw)}</div><div style="margin-top:4px">${esc(why)}</div></div><h2>数字を入れてみよう</h2>`+fl.map((f,j)=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${esc(f[0])}</span><span style="display:flex;align-items:center;gap:6px;width:50%"><input data-f="${j}" inputmode="decimal" value="${f[2]}" style="text-align:right"><span class="t">${esc(f[1])}</span></span></div>`).join('')+`<div class="c ans" id="sa"></div><button class="b bl" id="sx">くわしい解説を見る</button><div id="sxb" hidden class="c"></div><button class="b lv" id="sg">この式を「式から」の画面で解く</button>`;
 const calc=()=>{const v=[...$.querySelectorAll('[data-f]')].map(i=>i.value.trim()),sa=$.querySelector('#sa');
  if(!v.every(x=>/^-?\d+(\.\d+)?$/.test(x))){sa.innerHTML='<div class="t" style="color:#2D6B55">数字を入れてね</div>';return null}
  const ex=tp.replace(/\{(\d)\}/g,(_,n)=>v[+n].startsWith('-')?'('+v[+n]+')':v[+n]),r=Solve(ex);
  if(!r.ok){sa.innerHTML='<div class="t" style="color:#2D6B55">この数字だとうまく計算できないよ。入れ直してね。</div>';return null}
  sa.innerHTML=`<div class="t" style="color:#2D6B55">答え</div><div class="q">${esc(dA(r.ans))} ${esc(un)}</div><div class="t" style="color:#2D6B55;margin-top:4px">式：${esc(ex)}</div>`;return{ex,r}};
 let cu=calc();$.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{cu=calc();$.querySelector('#sxb').hidden=true});
 $.querySelector('#bk').onclick=()=>cat(ci);
 $.querySelector('#sx').onclick=()=>{if(!cu)return;const b=$.querySelector('#sxb');b.innerHTML=cu.r.steps.map(x=>`<p class="st">${esc(x)}</p>`).join('');b.hidden=!b.hidden};
 $.querySelector('#sg').onclick=()=>{if(cu)open({q:cu.ex,e:cu.ex,u:'',t:1,s:k})}}
const dA=a=>{const m=a.match(/^(.*?)（約 (.*?)）$/);if(!m||m[1].includes('x'))return a;let d=+(m[1].split('/')[1]||1);while(d%2===0)d/=2;while(d%5===0)d/=5;return(d===1?'':'約 ')+(+(+m[2]).toFixed(2))};
const ft=()=>{if(!$.querySelector('#ft'))$.insertAdjacentHTML('beforeend','<div id="ft" class="t" style="text-align:center;margin:28px 0 8px">Presented by 株式会社SAKURA WORKS<br>版 v13</div>')};new MutationObserver(ft).observe($,{childList:true});
/*SITEND*/

window.onerror=()=>{$.innerHTML='<div class="c err">うまく動きませんでした。ホームに戻ってやり直してください。</div>'};
go('home');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>r.update());let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&localStorage.getItem('fmsw')){rl=1;location.reload()}localStorage.setItem('fmsw','1')})}
</script></body></html>
