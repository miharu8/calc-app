<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FROST MATH</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#F6F3FC"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FROST MATH">
<style>
*{box-sizing:border-box}body{margin:0;background:#F6F3FC;color:#2B2F42;font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px 16px env(safe-area-inset-bottom)}h1{font-size:20px;letter-spacing:1px;color:#4B3F8F;margin:6px 0 2px}h2{font-size:16px;margin:16px 0 8px;color:#6B6F85;font-weight:500}
.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}.b{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:14px;margin-bottom:10px;font:500 16px inherit;text-align:left;cursor:pointer;font-family:inherit}
.bl{background:#DCEBFA;color:#2F5A8A}.pk{background:#FBE4EC;color:#8A3A58}.mt{background:#DDF3EA;color:#2D6B55}.lv{background:#E9E4F8;color:#4B3F8F}.gy{background:#ECEAF2;color:#8B8EA0}
small{display:block;font-weight:400;font-size:12px;opacity:.85}.chip{display:inline-block;border:0;padding:8px 14px;border-radius:99px;background:#fff;color:#4B3F8F;margin:0 4px 6px 0;font:inherit;font-size:14px}.chip.on{background:#4B3F8F;color:#fff}
input,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid #D9D3EE;border-radius:12px;background:#fff;color:#2B2F42}.q{font-size:24px;font-weight:500;word-break:break-all}.ans{background:#DDF3EA;color:#2D6B55}pre{white-space:pre-wrap;font:inherit;margin:0}
.st{margin:0 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E3DEF3;display:flex;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;background:none;padding:12px 0;font:inherit;font-size:13px;color:#6B6F85}nav .on{color:#4B3F8F;font-weight:600}.err{background:#FBE4EC;color:#8A3A58}.t{font-size:12px;color:#6B6F85}.bk{background:none;border:0;color:#4B3F8F;font:inherit;padding:4px 0}
.blk{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:56px;padding:0 12px;border-radius:12px;margin:4px;font-weight:500;font-size:18px}.dt{display:inline-block;width:20px;height:20px;border-radius:50%;margin:3px}.pie{display:inline-block;width:84px;height:84px;border-radius:50%;border:2px solid #4B3F8F;margin:6px}.lt{font-size:20px;font-weight:500;line-height:1.7}.pg span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D9D3EE;margin:0 3px}.pg .on{background:#4B3F8F}.fade{opacity:.35;text-decoration:line-through}
</style></head><body><main id="app"></main>
<nav><button data-v="home">ホーム</button><button data-v="rev">復習</button><button data-v="his">履歴</button></nav>
<script src="engine.js"></script>
<script>
const G=['小1','小2','小3','小4','小5','小6','中1','中2','中3'];
const B=[
[0,'たし算・ひき算','くり上がり・くり下がりに気をつけます。',[['8 + 5 は？','8+5',''],['13 − 6 は？','13-6',''],['27 + 15 は？','27+15','']]],
[1,'九九・かけ算','九九を声に出して確かめましょう。',[['7 × 8 は？','7×8',''],['6 × 9 は？','6×9',''],['12 ÷ 3 は？','12÷3','']]],
[2,'大きな数・わり算','わられる数を、わる数で分けます。',[['3200 + 4500 は？','3200+4500',''],['84 ÷ 4 は？','84÷4',''],['125 × 4 は？','125×4','']]],
[2,'長方形の面積','面積 = たて × よこ',[['たて4cm、よこ7cm の長方形の面積は？','4×7','cm²'],['1辺 6cm の正方形の面積は？','6×6','cm²']]],
[3,'小数','小数点の位置をそろえて計算します。',[['3.5 × 2 は？','3.5×2',''],['2.4 + 1.8 は？','2.4+1.8',''],['6.3 − 2.9 は？','6.3-2.9','']]],
[3,'分数のたし引き','分母が同じなら、分子だけ計算します。',[['3/7 + 2/7 は？','3/7+2/7',''],['5/8 − 1/8 は？','5/8-1/8','']]],
[4,'約分・通分','分母と分子を同じ数でわる（約分）。分母をそろえる（通分）。',[['1/2 + 1/3 は？','1/2+1/3',''],['3/4 − 1/6 は？','3/4-1/6',''],['6/8 を約分すると？','6/8','']]],
[4,'面積・体積','立体の体積 = たて × よこ × 高さ',[['たて5cm、よこ4cm、高さ3cm の直方体の体積は？','5×4×3','cm³'],['底辺8cm、高さ5cm の平行四辺形の面積は？','8×5','cm²']]],
[5,'割合','割合 = くらべる量 ÷ もとにする量',[['40人のうち 12人。割合（小数）は？','12/40',''],['800円の 25%（0.25）は？','800×0.25','円']]],
[5,'速さ・時間・距離','道のり = 速さ × 時間',[['時速60km で 2.5時間進む道のりは？','60×2.5','km'],['150km を 3時間で進む。時速は？','150÷3','km/h']]],
[5,'分数のかけ算・わり算','わり算は、わる数の逆数をかけます。',[['3/4 × 2/5 は？','3/4×2/5',''],['2/3 ÷ 4/5 は？','2/3÷(4/5)','']]],
[6,'分数・小数の混合計算','かっこの中から計算します。',[['(1/2 + 1/3) × 6 は？','(1/2+1/3)×6',''],['12 + 8 × 3 は？','12+8×3',''],['(12 + 8) ÷ 4 は？','(12+8)÷4','']]],
[6,'比例・□を使った式','□を x と書いて、方程式として解きます。',[['□ + 7 = 15 の □ は？','x+7=15',''],['4 × □ = 36 の □ は？','4x=36','']]],
[6,'円の面積・角度','円の面積 = 半径 × 半径 × 3.14',[['半径5cm の円の面積は？','5×5×3.14','cm²'],['三角形の2つの角が 50° と 60°。残りの角は？','180-50-60','°']]],
[6,'正負の数','負の数をたすことは、ひくことと同じです。',[['-5 + 12 は？','-5+12',''],['3 − 8 は？','3-8',''],['(-4) × 6 は？','(-4)×6','']]],
[7,'文字式','同じ文字の項はまとめられます。',[['3x + 2x を整理すると？','3x+2x',''],['2(x + 3) を展開すると？','2(x+3)',''],['3x + 5 − x を整理すると？','3x+5-x','']]],
[7,'一次方程式','x を左に、数を右に移します。',[['3x + 5 = 20','3x+5=20',''],['2x − 4 = 10','2x-4=10',''],['5x = 35','5x=35',''],['x/3 = 4','x/3=4',''],['2(x + 3) = 14','2(x+3)=14',''],['3x + 2 = 2x + 7','3x+2=2x+7','']]],
[7,'比例・反比例','y = ax は比例。xy = a は反比例。',[['y = 3x で x = 4 のとき y は？','3×4',''],['xy = 12 で x = 3 のとき y は？','12÷3','']]],
[7,'図形（おうぎ形・体積）','円柱の体積 = 底面積 × 高さ',[['半径3cm、高さ10cm の円柱の体積（π=3.14）は？','3×3×3.14×10','cm³']]],
[8,'連立方程式','加減法で、片方の文字を消します。',[['x+y=10、x-y=2','x+y=10、x-y=2',''],['2x+y=7、x-y=2','2x+y=7、x-y=2','']]],
[8,'不等式','負の数でわるときは不等号が逆向きになります。',[['2x − 3 > 5','2x-3>5',''],['−2x > 6','-2x>6','']]],
[8,'一次関数','y = ax + b の a が傾き。',[['y = 2x + 1 で x = 3 のとき y は？','2×3+1',''],['傾き2、切片1の直線で x = -2 のとき y は？','2×(-2)+1','']]],
[8,'式の計算・展開','多項式どうしは、1つずつかけて整理します。',[['(x+2)(x+3) を展開','(x+2)(x+3)',''],['(x+3)² を展開','(x+3)^2','']]],
[9,'展開・因数分解','かけて定数項、たして x の係数になる2数を探します。',[['x²+5x+6 を因数分解','x^2+5x+6 の因数分解',''],['x²−9 を因数分解','x^2-9 の因数分解','']]],
[9,'二次方程式','因数分解か解の公式で解きます。',[['x² − 5x + 6 = 0','x^2-5x+6=0',''],['x² − 9 = 0','x^2-9=0',''],['x² + 2x + 1 = 0','x^2+2x+1=0','']]],
[9,'平方根・三平方の定理','直角三角形の斜辺² = 他の2辺²の和',[['√49 + 3 は？','√49+3',''],['直角をはさむ辺が 3 と 4。斜辺²は？','3^2+4^2','']]],
[9,'確率・データ','確率 = 起こる場合の数 ÷ すべての場合の数',[['サイコロで偶数が出る確率は？','3/6',''],['5, 8, 6, 9, 7 の平均は？','(5+8+6+9+7)÷5','']]],
[3,'単位換算（長さ・重さ）','1m=100cm、1kg=1000g。ケタを動かして考えよう。',[['2.5m は何cm？','2.5×100','cm'],['3kg は何g？','3×1000','g'],['4500g は何kg？','4500÷1000','kg']]],
[5,'比','a:b のとき、前の数を何倍かして考えます。',[['3:2 の比で、2にあたる量が 8 のとき、3にあたる量は？','8÷2×3',''],['5:4 の比で、4にあたる量が 12 のとき、5にあたる量は？','12÷4×5','']]],
[7,'平面図形（平行線・角）','三角形の内角の和は180°。n角形は 180×(n−2)。',[['三角形の2つの角が 70° と 45°。残りの角は？','180-70-45','°'],['正五角形の内角の和は？','180×(5-2)','°']]],
[8,'相似','相似比がわかれば、長さがわかります。',[['相似比 1:3。小さい辺が 4cm のとき、大きい辺は？','4×3','cm'],['相似比 2:5。小さい辺が 6cm のとき、大きい辺は？','6÷2×5','cm']]],
[9,'二次関数','y = ax² に x を入れて y を出します。',[['y = 2x² で x = 3 のとき y は？','2×3^2',''],['y = x² で x = −4 のとき y は？','(-4)^2',''],['y = −x² + 5 で x = 2 のとき y は？','-2^2+5','']]]
];
const USE={"単位換算（長さ・重さ）": "ひもの長さや荷物の重さを、cm↔m・g↔kg に直して比べる時に使うよ！", "比": "ホットケーキの材料を、人数に合わせて増やす時に使うよ。（牛乳:粉＝3:2 みたいに）", "平面図形（平行線・角）": "三角形の屋根の角度や、多角形の角度を出す時に使うよ。", "相似": "地図の縮尺や、写真の拡大・縮小、影から木の高さを出す時に使うよ！", "二次関数": "ボールを投げた高さや、車のブレーキの距離を式で出す時に使うよ。","たし算・ひき算": "お菓子やジュースの合計と、おつりを出す時に使うよ！", "九九・かけ算": "同じ値段のものを何個か買う時、「1個の値段×個数」で一気に出せる！", "大きな数・わり算": "人数でお菓子を同じ数ずつ分ける時や、ぜんぶで何円かを出す時に使うよ。", "長方形の面積": "部屋のゆかの広さや、畑・コートの広さをくらべる時に使えるよ！", "小数": "身長・体重・タイムみたいな、はんぱな数の計算で出てくる！", "分数のたし引き": "ピザやケーキを「何個分食べたか」合計する時にそのまま使えるよ。", "約分・通分": "分数をスッキリ簡単にしたり、ちがう分母をそろえてくらべる時に使うよ！", "面積・体積": "プールに水が何L入るか、箱に荷物が入るかを考える時に使うよ。", "割合": "セールの「25%OFF」や、テストの正答率を出す時に超使う！", "速さ・時間・距離": "「家から駅まで何分？」「何時に着く？」を計算できるよ。", "分数のかけ算・わり算": "ケーキの2/3を3人で分ける、みたいに「ひと切れの量」を出す時に使うよ。", "分数・小数の混合計算": "わりびきと税金が混ざったお買い物を、順番をまちがえずに計算する時に使うよ！", "比例・□を使った式": "「□円のものを3個買って300円」みたいに、わからない数を□にして探す時に使うよ。", "円の面積・角度": "ピザの大きさ比べや、三角形の残りの角度を出す時に使うよ！", "正負の数": "気温の上がり下がりや、おこづかいの増えた減ったを計算する時に使うよ。", "文字式": "いろんな値段に使える「ルール」を1つの式で書ける。例：1個x円を3個で 3x 円！", "一次方程式": "「何日でお金が貯まる？」「いくつ買える？」みたいに、わからない数を見つける時に使うよ！", "比例・反比例": "「時間が2倍なら道のりも2倍」「人が増えると1人分が減る」を式にできるよ。", "図形（おうぎ形・体積）": "ホールケーキの一切れや、缶ジュースの中身の量を出す時に使うよ。", "連立方程式": "「りんご1個とみかん1個で○円」みたいに、わからない数が2つある時に使うよ！", "不等式": "「予算1000円以内で何個まで買える？」みたいに、いくつまでOKかを決める時に使うよ。", "一次関数": "スマホ料金のように「基本料金＋使った分」で金額が変わる時を式にできる！", "式の計算・展開": "カッコつきの式をバラして、面積の公式をつくる時に使うよ。", "展開・因数分解": "ぐちゃぐちゃの式をスッキリ短くして、方程式を解きやすくするよ！", "二次方程式": "ボールが飛ぶ高さや、「面積がこうなる四角形のたてよこは？」を出す時に使うよ。", "平方根・三平方の定理": "はしごの長さや、テレビ画面のななめの長さを出す時に使うよ！", "確率・データ": "くじの当たりやすさや、テストの平均点・クラスの結果を比べる時に使うよ。"};
const useOf=e=>/[<>≤≥]/.test(e)?'予算や制限の中で「いくつまでOK？」を決める時に使うよ。':/[、,]/.test(e)?'わからない数が2つある時、2つのヒントから見つけるのに使うよ！':/\^2/.test(e)&&/=/.test(e)?'ボールの高さや、面積から四角形のたてよこを出す時に使うよ。':/因数分解/.test(e)?'長い式をスッキリ短くして、方程式を解きやすくする時に使うよ！':/=/.test(e)?'「何日で貯まる？」「いくつ買える？」みたいに、わからない数を見つける時に使うよ！':/x|y/.test(e)?'カッコつきの式をバラして整理して、あとの計算をラクにする時に使うよ。':'お買い物の合計やわりびきなど、毎日の計算で順番を守る時に使うよ。';
const NM=p=>p.ui!==undefined?G[B[p.ui][0]]+' '+B[p.ui][1]:'自分で入力した式';
const L=()=>{try{return JSON.parse(localStorage.getItem('fm1'))||{rev:{},his:[]}}catch(e){return{rev:{},his:[]}}};
const S=d=>{try{localStorage.setItem('fm1',JSON.stringify(d))}catch(e){}};
const $=document.getElementById('app'),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let gr=0,cur=null,msg='';
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home,rev,his,unit,pr}[v]||home)()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=null;go(b.dataset.v)});
function home(){$.innerHTML=`<h1>FROST MATH</h1><div class="t">小1〜中3の算数・数学 ・ 版 v6</div><h2>どれから始める？</h2>
<div class="c lv"><b>文字で入力</b><small>式や問題を打ち込む（例：3x+5=20）</small><input id="in" placeholder="3x+5=20" autocomplete="off" style="margin:8px 0"><button class="b bl" id="go" style="margin:0;justify-content:center">答えを見る</button></div>
<button class="b pk" id="ph"><span><b>写真で入力</b><small>撮影して読み取り、直してから解く（最初の1回はネットが必要）</small></span></button><input type="file" id="pf" accept="image/*" hidden><div id="pm"></div>
<h2>学年から選ぶ</h2><div>${G.map((g,i)=>`<button class="chip ${i===gr?'on':''}" data-g="${i}">${g}</button>`).join('')}</div>
${B.map((u,i)=>u[0]===gr?`<button class="b mt" data-u="${i}"><span>${u[1]}<small>${u[3].length}問</small></span></button>`:'').join('')||'<div class="c">この学年の単元は、これから追加します。</div>'}`;
$.querySelector('#go').onclick=()=>{const v=$.querySelector('#in').value;if(v.trim())open({q:v,e:v,u:'',t:1})};
$.querySelector('#in').onkeydown=e=>{if(e.key==='Enter')$.querySelector('#go').click()};
$.querySelector('#ph').onclick=()=>$.querySelector('#pf').click();ocrInit();
$.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gr=+b.dataset.g;home()});$.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>unit(+b.dataset.u))}
function unit(i){const u=B[i];$.innerHTML=`<button class="bk" id="bk">← もどる</button><h1>${G[u[0]]} ${u[1]}</h1><div class="t">${u[2]}</div><div class="c mt" style="margin-top:10px"><b>どんな時に使う？</b><br>${USE[u[1]]||""}</div><h2>問題</h2>`+u[3].map((p,j)=>`<button class="b bl" data-p="${j}">${esc(p[0])}</button>`).join('');
$.querySelector('#bk').onclick=home;$.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=u[3][+b.dataset.p];open({q:p[0],e:p[1],u:p[2],h:u[2],ui:i,pj:+b.dataset.p})})}
function open(p){cur=p;pr()}
function pr(){const p=cur,r=Solve(p.e),k=p.q+'|'+p.e;if(!r.ok){$.innerHTML=`<button class="bk" id="bk">← もどる</button><div class="c"><div class="q">${esc(p.q)}</div></div><div class="c err"><pre>${esc(r.err)}</pre></div>`;$.querySelector('#bk').onclick=home;return}
$.innerHTML=`<button class="bk" id="bk">← もどる</button><div class="c"><div class="t">${p.t?'入力した式':G[B[p.ui][0]]+' '+B[p.ui][1]}</div><div class="q">${esc(p.q)}</div></div>
<div class="c ans"><div class="t" style="color:#2D6B55">答え</div><div class="q">${esc(r.ans)} ${esc(p.u)}</div></div>
<button class="b bl" id="ex">解説を見る</button><div id="exb" hidden class="c">${r.steps.map(s=>`<p class="st">${esc(s)}</p>`).join('')}</div>
<button class="b lv" id="hn">ヒントを見る</button><div id="hb" hidden class="c">${esc(p.h||'式を読み取って、計算の順番や移項（左右に移す）の考え方を確認しましょう。')}</div>
<button class="b mt" id="us">どんな時に使う？</button><div id="ub" hidden class="c">${esc(p.ui!==undefined?USE[B[p.ui][1]]:useOf(p.e))}</div>
<button class="b pk" id="lf">生活で言うと？</button><div id="lb" hidden class="c"></div>
<div class="row"><button class="b mt" id="ok" style="justify-content:center">できた</button><button class="b pk" id="rv" style="justify-content:center">復習する</button></div><div id="mg" class="t">${msg}</div>
${p.ui!==undefined&&B[p.ui][3][p.pj+1]?'<button class="b gy" id="nx" style="justify-content:center">次の問題へ</button>':''}`;msg='';
const t=id=>$.querySelector(id);t('#bk').onclick=()=>cur.ui!==undefined?unit(cur.ui):home();
t('#ex').onclick=()=>t('#exb').hidden=!t('#exb').hidden;t('#lf').onclick=()=>{const b=t('#lb');b.hidden=!b.hidden;if(!b.hidden)showLife(p.e,0)};t('#us').onclick=()=>t('#ub').hidden=!t('#ub').hidden;t('#hn').onclick=()=>t('#hb').hidden=!t('#hb').hidden;
t('#ok').onclick=()=>{const d=L();d.his.unshift({k,q:p.q,r:'ok',n:NM(p),t:Date.now()});d.his=d.his.slice(0,300);if(d.rev[k])delete d.rev[k];S(d);t('#mg').textContent='記録しました。復習リストからも外しました。'};

$.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>open(a[+b.dataset.r]))}

$.innerHTML=`<h1>学習履歴</h1><h2>やった単元</h2>`+(Object.keys(m).map(n=>`<div class="c"><div>${esc(n)}</div><div class="t">できた ${m[n].ok}回 ・ 復習 ${m[n].rv}回</div></div>`).join('')||'<div class="c">まだありません。問題で「できた」か「復習する」を押すと、ここに出るよ。</div>')+`<h2>最近のきろく（新しい順）</h2>`+d.his.slice(0,40).map(x=>`<div class="c"><div>${esc(x.q)}</div><div class="t">${new Date(x.t).toLocaleString('ja-JP')} ・ ${x.r==='ok'?'できた':'復習'}</div></div>`).join('')}
/*LIFE*/
const CB=['#E9E4F8','#4B3F8F'],CP=['#FBE4EC','#8A3A58'],CM=['#DDF3EA','#2D6B55'],CG=['#ECEAF2','#8B8EA0'];
const bx=(t,c,f)=>`<span class="blk ${f?'fade':''}" style="background:${c[0]};color:${c[1]}">${t}</span>`;
const dts=(n,c)=>n>24?bx(n+'個',[c,'#fff']):Array.from({length:n},()=>`<span class="dt" style="background:${c}"></span>`).join('');
const pie=(n,d)=>`<span class="pie" style="background:conic-gradient(#8E7CE0 0 ${Math.min(100,n/d*100)}%,#fff 0)"></span>`;
const rep=(n,h)=>n>6?bx('×'+n+' '+h,CB):Array(n).fill(h).map(x=>bx(x,CB)).join('');
function life(e){
 const l=Solve.lin&&Solve.lin(e);
 if(l){const{a,ad,b,c}=l;
  if(ad>1&&a*ad===1&&b===0&&c>0){const d=ad;return[
   {t:`x円を ${d}人で同じ金額ずつ分けたら、1人 ${c}円になったよ。ぜんぶで何円？`,v:bx('?円',CB)+' ÷ '+d+'人 = '+bx('1人 '+c+'円',CM)},
   {t:`${d}人が ${c}円ずつ持っているから、あわせると ${c} × ${d} = ${c*d}円`,v:Array(Math.min(d,6)).fill(bx(c+'円',CM)).join('')},
   {t:`答え：x = ${c*d}（${c*d}円）`,v:bx(c*d+'円',CM)}]}
  const v=(c-b)/a;
  if(ad===1&&a>=1&&Number.isInteger(a)&&c-b>0&&v>0){
   const s=[{t:`お菓子（1個 ?円）を ${a}個${b>0?'と、ガム'+b+'円を買って':b<0?'買って、'+(-b)+'円引きのクーポンを使って':'買って'}、ぜんぶで ${c}円。お菓子1個はいくら？`,v:rep(a,'?円')+(b>0?' ＋ '+bx('ガム '+b+'円',CP):b<0?' － '+bx('クーポン '+(-b)+'円',CP):'')+' ＝ '+bx(c+'円',CM)}];
   if(b!==0)s.push({t:b>0?`まず、ガムの ${b}円 をのぞくよ。${c} − ${b} = ${c-b}円`:`まず、クーポンの ${-b}円 をもとにもどすよ。${c} ＋ ${-b} = ${c-b}円`,v:bx('ガム',CP,1)+' '+bx('お菓子だけで '+(c-b)+'円',CM)});
   if(a>1)s.push({t:`お菓子 ${a}個で ${c-b}円。1個ぶんは ${c-b} ÷ ${a} = ${v}円`,v:Array(Math.min(a,6)).fill(bx(+v.toFixed(2)+'円',CB)).join('')});
   s.push({t:`答え：x = ${+v.toFixed(2)}（お菓子は1個 ${+v.toFixed(2)}円）。ためし算：${a} × ${+v.toFixed(2)} ${b<0?'− '+(-b):b>0?'+ '+b:''} = ${c}`,v:bx(+v.toFixed(2)+'円',CM)});return s}}
 const t=e.replace(/\s/g,''),m=t.match(/^(\d+)([+\-×÷*\/])(\d+)$/);
 if(m){const a=+m[1],b=+m[3],o=m[2];
  if(o==='+')return[{t:`${a}個と ${b}個を合わせると、ぜんぶで何個？`,v:dts(a,'#8E7CE0')+' ＋ '+dts(b,'#E58CAE')},{t:`答え：${a} + ${b} = ${a+b}個`,v:dts(a+b,'#4CAF8A')}];
  if(o==='-')return[{t:`${a}個あって、${b}個食べたよ。のこりは何個？`,v:dts(a,'#8E7CE0')},{t:`答え：${a} − ${b} = ${a-b}個`,v:dts(Math.max(a-b,0),'#4CAF8A')}];
  if(o==='×'||o==='*')return[{t:`1袋に ${b}個ずつ入ったお菓子が ${a}袋。ぜんぶで何個？`,v:rep(a,b+'個')},{t:`答え：${b} × ${a} = ${a*b}個`,v:dts(a*b,'#4CAF8A')}];
  if(b>0)return[{t:`${a}個を ${b}人で同じ数ずつ分けるよ。1人何個？`,v:dts(a,'#8E7CE0')+' → '+b+'人'},{t:`答え：${a} ÷ ${b} = ${+(a/b).toFixed(2)}個`,v:bx('1人 '+(+(a/b).toFixed(2))+'個',CM)}]}
 const f=t.match(/^(\d+)\/(\d+)([+-])(\d+)\/(\d+)$/);
 if(f){const[a,b,o,c,d]=[+f[1],+f[2],f[3],+f[4],+f[5]],n=o==='+'?a*d+c*b:a*d-c*b,q=b*d;
  return[{t:o==='+'?`ピザを ${a}/${b} 食べて、あとで ${c}/${d} 食べたよ。あわせてどれだけ？`:`ピザが ${a}/${b} あって、${c}/${d} 食べたよ。のこりは？`,v:pie(a,b)+(o==='+'?' ＋ ':' － ')+pie(c,d)},{t:`答え：${Solve(e).ans.replace(/（約.*）/,'')}（ピザ1枚のうち）`,v:pie(n,q)}]}

 const Q=Solve.q&&Solve.q(e);
 if(Q){const A=Solve(e).ans;
  if(Q.k==='ineq'){const{op,a,b,c}=Q,w={'<':'より安い','≤':'以下','>':'より高い','≥':'以上'}[op],o=op==='<'||op==='≤'?'以下・未満':'以上・超';
   return[{t:`お菓子（1個 x円）を ${a}個と、ガム${b}円を買うよ。ぜんぶで ${c}円${w}にしたい。お菓子1個は、いくらならOK？`,v:rep(a,'x円')+' ＋ '+bx('ガム '+b+'円',CP)+' '+bx(op+' '+c+'円',CM)},{t:`ガムの ${b}円 をのぞくと、お菓子だけで ${c} − ${b} = ${c-b}円。これと くらべて「${op}」になればOK。`,v:bx('お菓子だけ '+op+' '+(c-b)+'円',CM)},{t:`答え：${A}`,v:bx(A,CM)}]}
  if(Q.k==='lin2'){const{a,b,c,d}=Q;return[{t:`ケーキ（1個 x円）。Aさんは ${a}個と ${b}円のクッキー、Bさんは ${c}個と ${d}円のクッキー。ふたりの合計は同じだったよ。`,v:'A '+rep(a,'x円')+bx('クッキー '+b+'円',CP)+'<br>B '+rep(c,'x円')+bx('クッキー '+d+'円',CP)},{t:`ふたりに共通のケーキ ${c}個ぶんを、両方からとるよ！`,v:'A '+rep(a-c,'x円')+bx('クッキー '+b+'円',CP)+'<br>B '+bx('クッキー '+d+'円',CP)},{t:`のこったケーキ ${a-c}個ぶん = ${d} − ${b} = ${d-b}円。1個ぶんは ${d-b} ÷ ${a-c}。`,v:bx((d-b)+'円 ÷ '+(a-c)+'個',CM)},{t:`答え：${A}`,v:bx(A,CM)}]}
  if(Q.k==='sys'){let[p,r]=Q.q;const sp=Q.q.find(z=>z[0]===1&&z[1]===1),df=Q.q.find(z=>z[0]===1&&z[1]===-1);
   if(sp&&df){const S=sp[2],D=df[2];return[{t:`りんご(x円)とみかん(y円)。合わせて ${S}円。りんごはみかんより ${D}円 高いよ。`,v:bx('りんご ＋ みかん ＝ '+S+'円',CB)+'<br>'+bx('りんご － みかん ＝ '+D+'円',CP)},{t:`りんごが ${D}円ぶん高いのを、いったん引くと、みかん2つぶんで ${S} − ${D} = ${S-D}円。`,v:bx('みかん ×2 ＝ '+(S-D)+'円',CM)},{t:`みかん1個は ${S-D} ÷ 2 = ${(S-D)/2}円。りんごは ${(S-D)/2} + ${D} = ${(S-D)/2+D}円。`,v:bx('みかん '+(S-D)/2+'円',CM)+bx('りんご '+((S-D)/2+D)+'円',CP)},{t:`答え：${A}`,v:bx(A,CM)}]}
   if(Q.q.every(z=>z[0]>0&&z[1]>0&&z[2]>0))return[{t:`りんご(x円)とみかん(y円)。Aさんは りんご${p[0]}個とみかん${p[1]}個で ${p[2]}円。Bさんは りんご${r[0]}個とみかん${r[1]}個で ${r[2]}円。`,v:'A '+rep(p[0],'りんご')+rep(p[1],'みかん')+bx(p[2]+'円',CM)+'<br>B '+rep(r[0],'りんご')+rep(r[1],'みかん')+bx(r[2]+'円',CM)},{t:'ふたりの買い物を引き算して、どちらか片方の数を消すと、1つの文字だけになるよ。',v:bx('1種類だけにする',CB)},{t:`答え：${A}`,v:bx(A,CM)}]}}
 return null}
function showLife(e,i){const box=document.getElementById('lb'),s=life(e);
 if(!s){box.innerHTML='<div class="lt">'+esc(useOf(e))+'</div><div class="t" style="margin-top:8px">この式は、絵つきの説明がまだないよ。</div>';return}
 box.innerHTML=`<div class="pg">${s.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div><div class="lt" style="margin:10px 0">${esc(s[i].t)}</div><div style="margin:10px 0">${s[i].v}</div><div class="row">${i>0?'<button class="b gy" id="lp" style="justify-content:center">もどる</button>':'<span></span>'}${i<s.length-1?'<button class="b lv" id="ln" style="justify-content:center">次へ</button>':'<span></span>'}</div>`;
 const a=document.getElementById('lp'),b=document.getElementById('ln');if(a)a.onclick=()=>showLife(e,i-1);if(b)b.onclick=()=>showLife(e,i+1)}
/*END*/

/*OCR*/
const fixOCR=s=>String(s).replace(/[Xx×](?=\s*[\d(])/g,m=>m).replace(/X/g,'x').replace(/[—–−]/g,'-').split('\n').map(z=>z.trim()).filter(Boolean).join('\n');
function loadOCR(){return new Promise((ok,ng)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>ng(new Error('load'));document.head.appendChild(s)})}
function prep(file){return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=(p[i]+p[i+1]+p[i+2])/3;g=g>150?255:g<90?0:g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(u);ok(c)};im.onerror=()=>ng(new Error('img'));im.src=u})}
function ocrInit(){const f=document.getElementById('pf'),m=document.getElementById('pm');if(!f)return;
 f.onchange=async()=>{const file=f.files[0];if(!file)return;m.innerHTML='<div class="c" id="pg">読み取り中… 少し待ってね（最初の1回は時間がかかるよ）</div>';
  try{const img=await prep(file);await loadOCR();const w=await Tesseract.createWorker('eng',1,{logger:x=>{const d=document.getElementById('pg');if(d&&x.status==='recognizing text')d.textContent='読み取り '+Math.round(x.progress*100)+'%'}});await w.setParameters({tessedit_char_whitelist:'0123456789xyXY+-*/=()<>^.,×÷'});const r=await w.recognize(img);await w.terminate();
   const t=fixOCR(r.data.text);m.innerHTML=`<div class="c"><div class="t">読み取った式（まちがいがないか見て、直してね）</div><textarea id="pt" rows="3">${esc(t)}</textarea><div class="t" style="margin:6px 0">手書きや分数は、まちがえやすいよ。÷ や × は特に見てね。</div><button class="b lv" id="pg2" style="justify-content:center;margin:0">この式で解く</button></div>`;
   document.getElementById('pg2').onclick=()=>{const v=document.getElementById('pt').value.trim();if(v)open({q:v,e:v.replace(/\n+/g,'、'),u:'',t:1})}}
  catch(e){m.innerHTML='<div class="c err">写真の読み取りができなかったよ。最初の1回は、ネットにつながっている必要があるよ。つながってから、もう一度ためしてね。文字入力ならいまでも使えるよ。</div>'}f.value=''}}
/*OCREND*/

window.onerror=()=>{$.innerHTML='<div class="c err">うまく動きませんでした。ホームに戻ってやり直してください。</div>'};
go('home');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>r.update());let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&localStorage.getItem('fmsw')){rl=1;location.reload()}localStorage.setItem('fmsw','1')})}
