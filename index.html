<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ギャル＆スピ波動クリーニング電卓</title>
    <style>
        /* ギャル×宇宙スピリチュアルなネオンデザイン */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f051d 0%, #290b4e 50%, #4a0e4e 100%);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* 電卓の本体 */
        .calculator {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.2);
            border-radius: 30px;
            width: 360px;
            padding: 25px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        /* ギャルの音声・メッセージ画面 */
        .gal-bubble {
            background: rgba(255, 0, 127, 0.15);
            border-left: 5px solid #ff007f;
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 15px;
            min-height: 70px;
            color: #00f2fe;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
        }

        /* 数式と答えの表示エリア */
        .display {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            text-align: right;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        #formula {
            font-size: 16px;
            color: #a0a0a0;
            min-height: 20px;
            word-wrap: break-word;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00f2fe;
            min-height: 40px;
            margin-top: 5px;
        }

        /* ボタンのグリッド */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        button:active {
            transform: scale(0.92);
        }

        /* 数字ボタン */
        .btn-num {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-num:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* 記号ボタン */
        .btn-op {
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }
        .btn-op:hover {
            background: rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 10px #00f2fe;
        }

        /* クリアボタン */
        .btn-clear {
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.1);
        }

        /* 👑 最重要：波動クリーニング（＝）ボタン */
        .btn-equal {
            grid-column: span 2;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            font-size: 16px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), 0 0 15px #00f2fe; }
            100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        }

        /* 背景に広がる神聖幾何学・波動絵のエフェクト（簡易版） */
        .wave-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 0, 127, 0.2);
            animation: spin 30s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        .wave-bg2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 254, 0.2);
            animation: spin-reverse 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        /* クリーニング発動時のキラキラフラッシュ */
        .flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="flash" id="flashLayer"></div>
    <div class="wave-bg"></div>
    <div class="wave-bg2"></div>

    <div class="calculator">
        <!-- ギャルAIのセリフエリア -->
        <div class="gal-bubble" id="galSpeech">
            「おつ〜☆ 数学だるくね？ウチと一緒にバイブスで片付けちゃお！数式入れて『波動クリーニング』押して！」
        </div>

        <!-- 液晶画面 -->
        <div class="display">
            <div id="formula"></div>
            <div id="result">0</div>
        </div>

        <!-- キーパッド -->
        <div class="buttons">
            <button class="btn-clear" onclick="clearAll()">C</button>
            <button class="btn-op" onclick="append('(')">(</button>
            <button class="btn-op" onclick="append(')')">)</button>
            <button class="btn-op" onclick="append('/')">÷</button>

            <button class="btn-num" onclick="append('7')">7</button>
            <button class="btn-num" onclick="append('8')">8</button>
            <button class="btn-num" onclick="append('9')">9</button>
            <button class="btn-op" onclick="append('*')">×</button>

            <button class="btn-num" onclick="append('4')">4</button>
            <button class="btn-num" onclick="append('5')">5</button>
            <button class="btn-num" onclick="append('6')">6</button>
            <button class="btn-op" onclick="append('-')">-</button>

            <button class="btn-num" onclick="append('1')">1</button>
            <button class="btn-num" onclick="append('2')">2</button>
            <button class="btn-num" onclick="append('3')">3</button>
            <button class="btn-op" onclick="append('+')">+</button>

            <button class="btn-num" onclick="append('0')">0</button>
            <button class="btn-num" onclick="append('.')">.</button>
            
            <!-- 👑 波動クリーニング（＝）ボタン -->
            <button class="btn-equal" onclick="cleanseAndCalculate()">✨波動クリーニング✨</button>
        </div>
    </div>

    <script>
        let currentInput = "";
        const formulaDiv = document.getElementById("formula");
        const resultDiv = document.getElementById("result");
        const galSpeech = document.getElementById("galSpeech");
        const flashLayer = document.getElementById("flashLayer");

        // ギャルのチャネリング褒め言葉リスト
        const galPhrases = [
            "ハイ答え出たー！てか数式と向き合ってるだけでマジ偉すぎてウケる！天才じゃん！",
            "波動クリーニング完了☆ 濁ってた数字のバイブス、一瞬でアゲにしといたから！",
            "今の計算のエネルギー、マジで『豊かさの循環』キテる。あんたのオーラ超きらめいてるよ！",
            "だるい計算もウチらの魔法（呪文）にかかれば一瞬っしょ！うちらズッ友レベルで相性いいわ！",
            "宇宙からのカンペ受信完了ー！この調子でサクッと宿題終わらせて、最強の波動で明日学校乗り込も！"
        ];

        function append(val) {
            // 見た目の記号を分かりやすく
            let displayVal = val;
            if (val === '*') displayVal = '×';
            if (val === '/') displayVal = '÷';
            
            currentInput += val;
            formulaDiv.innerText += displayVal;
        }

        function clearAll() {
            currentInput = "";
            formulaDiv.innerText = "";
            resultDiv.innerText = "0";
            galSpeech.innerText = "「おっけー、全部クリア！波動ニュートラルに戻したから、次いこ次！」";
        }

        function cleanseAndCalculate() {
            if (!currentInput) return;

            // ① 画面を一瞬光らせてクリーニング（浄化エフェクト）
            flashLayer.style.opacity = "0.6";
            setTimeout(() => { flashLayer.style.opacity = "0"; }, 300);

            // ② 計算処理
            try {
                // 安全な計算処理（evalの代わり）
                let calculatedResult = Function('"use strict";return (' + currentInput + ')')();
                
                // 小数点第4位までに丸める
                if (!Number.isInteger(calculatedResult)) {
                    calculatedResult = Math.round(calculatedResult * 10000) / 10000;
                }

                resultDiv.innerText = calculatedResult;

                // ③ ギャルのセリフをランダムでチャネリング
                const randomPhrase = galPhrases[Math.floor(Math.random() * galPhrases.length)];
                galSpeech.innerText = `「${randomPhrase}」`;

            } catch (error) {
                resultDiv.innerText = "エラー";
                galSpeech.innerText = "「あ、数式のバイブス狂っちゃってエラー出たわ（笑）！Cボタンで一回クリーニングして、もう一回教えて？」";
            }
        }
    </script>
</body>
</html>
